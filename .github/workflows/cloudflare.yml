# Publishes the standalone app (public/ + the sign-in worker) to Cloudflare whenever it changes on main.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token using the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the right of your Cloudflare dashboard's Workers page
#   GOOGLE_CLIENT_ID       from Google Cloud -> APIs & Services -> Credentials (OAuth client, "Web application")
#   GOOGLE_CLIENT_SECRET   from the same OAuth client
#   COOKIE_SECRET          any long random string (it encrypts the sign-in cookie)
name: Cloudflare

on:
  push:
    branches: [main]
    paths: [index.html, public/**, worker/**, wrangler.toml, .github/workflows/cloudflare.yml]
  workflow_dispatch:

concurrency: cloudflare

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip until the Cloudflare secrets are set
        if: env.READY != 'true'
        run: echo "::notice::Add the Cloudflare and Google secrets (see SETUP.md) to publish the standalone app."
      - uses: actions/checkout@v5
        if: env.READY == 'true'
      - name: Put the app page next to its icons
        if: env.READY == 'true'
        run: cp index.html public/index.html
      - name: Make sure the reminder storage (Workers KV) exists
        if: env.READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --silent --no-save wrangler@4
          find_id() { npx wrangler kv namespace list 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const list = JSON.parse(s.slice(s.indexOf("[")));
              const ns = list.find(n => n.title === "g-logger-push" || n.title.endsWith("-g-logger-push"));
              console.log(ns ? ns.id : "");
            });'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler kv namespace create g-logger-push; ID=$(find_id); fi
          test -n "$ID"
          printf '\n[[kv_namespaces]]\nbinding = "KV"\nid = "%s"\n' "$ID" >> wrangler.toml
          tail -4 wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        if: env.READY == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            COOKIE_SECRET
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
