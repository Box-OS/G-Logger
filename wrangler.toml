# Cloudflare Worker that hosts G<Logger: the page in ./public plus the sign-in endpoints in worker/worker.js.
name = "g-logger"
main = "worker/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Checks for long-running timers every 10 minutes and sends reminders.
[triggers]
crons = ["*/10 * * * *"]

# Reminder storage (Workers KV). The deploy workflow creates the namespace and adds its id below.
