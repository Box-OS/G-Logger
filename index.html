<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F1F2F4; --surface:#FFFFFF; --ink:#16181C; --muted:#6A707A; --line:rgba(22,24,28,.09); --danger:#C5221F; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#121316; --surface:#1D1F23; --ink:#F1F2F4; --muted:#8E95A0; --line:rgba(241,242,244,.08); --danger:#F28B82; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --paper:#121316; --surface:#1D1F23; --ink:#F1F2F4; --muted:#8E95A0; --line:rgba(241,242,244,.08); --danger:#F28B82; color-scheme:dark; }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; height:100%; }
  body {
    margin:0 auto; padding:0; max-width:460px; height:100%; overflow:hidden;
    display:flex; flex-direction:column;
    font-family:'Geist',-apple-system,system-ui,sans-serif; font-size:16px; line-height:1.4;
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  .hidden { display:none !important; }
  button, input, select { font:inherit; color:inherit; }
  button { border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .12s ease, background-color .2s ease, opacity .2s ease; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

  header { flex:none; display:flex; align-items:center; gap:8px; height:60px; padding:8px 16px 0; }
  #pager { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  #pager::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; min-width:0; scroll-snap-align:start; scroll-snap-stop:always; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; padding:14px 16px 40px; }
  #tabbar { flex:none; display:flex; border-top:1px solid var(--line); background:var(--paper); padding:6px 6px max(8px, env(safe-area-inset-bottom)); }
  #tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 2px; color:var(--muted); font-size:11px; font-weight:600; }
  #tabbar button svg { width:23px; height:23px; }
  #tabbar button.on { color:var(--ink); }
  #tabbar button:active { transform:none; }
  h1 { margin:0 auto 0 0; font-size:19px; font-weight:700; letter-spacing:-.025em; }
  .round { width:40px; height:40px; flex:none; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); }
  .round svg { width:19px; height:19px; }
  #tabs { display:flex; padding:3px; border-radius:999px; background:var(--surface); border:1px solid var(--line); }
  #tabs button { height:32px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:500; color:var(--muted); }
  #tabs button.on { background:var(--ink); color:var(--paper); }

  /* ---------- timer: the big hold-to-start button ---------- */
  #dial {
    position:relative; display:block; margin:6px auto 0; width:min(80vw, 300px); aspect-ratio:1; border-radius:50%;
    background:#FFFFFF; color:#16181C; padding:0;
    box-shadow:0 24px 60px rgba(22,24,28,.10), 0 2px 8px rgba(22,24,28,.06);
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  #dial:active, #dial.holding { transform:scale(.965); }
  #dial svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); pointer-events:none; }
  #dial .track { stroke:rgba(22,24,28,.06); }
  #dial .ring { stroke:var(--ring, #16181C); transition:stroke .3s ease; }
  .face { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; pointer-events:none; }
  #what { font-size:15px; font-weight:600; letter-spacing:-.01em; max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sub { font-size:13px; color:#6A707A; max-width:66%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:18px; margin-top:-4px; }
  #clock { font-size:clamp(46px, 15vw, 60px); font-weight:600; line-height:1; letter-spacing:-.045em; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  #dial.idle #clock { color:#C4C7CD; }
  #hint { font-size:13px; font-weight:500; color:#6A707A; }
  #adjust { display:flex; align-items:center; justify-content:center; gap:10px; margin:18px auto 0; }
  #adjust button { height:38px; min-width:58px; padding:0 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  #startedAt { min-width:132px; text-align:center; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #cancel { display:block; margin:6px auto 0; height:40px; padding:0 18px; border-radius:999px; color:var(--muted); font-size:14px; font-weight:500; }

  .field {
    width:100%; height:52px; padding:0 20px; border-radius:999px; outline:none;
    background:var(--surface); border:1px solid var(--line); font-size:16px;
  }
  .field::placeholder { color:var(--muted); }
  .field:focus { border-color:color-mix(in srgb, var(--ink) 35%, transparent); }
  #title { height:54px; padding:0 22px; margin:26px 0 12px; }

  #cats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cat {
    display:flex; align-items:center; gap:11px; height:56px; padding:0 18px; border-radius:999px; text-align:left;
    background:var(--surface); border:1px solid var(--line); font-size:16px; font-weight:500;
  }
  .cat span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; background:var(--cc); }
  .cat.active { background:var(--cc); color:var(--on-cc); border-color:transparent; }
  .cat.active .dot { background:var(--on-cc); }

  #msg { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translate(-50%, 8px); z-index:15; max-width:calc(100% - 48px); padding:9px 16px; border-radius:999px; background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.28); font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  #msg.show { opacity:1; transform:translate(-50%, 0); }

  /* ---------- history ---------- */
  .bar-row { display:flex; gap:8px; }
  .pillbtn { height:46px; padding:0 20px; border-radius:999px; font-size:15px; font-weight:600; }
  .pillbtn.primary { background:var(--ink); color:var(--paper); }
  .pillbtn.soft { background:var(--surface); border:1px solid var(--line); }
  .day { margin-top:24px; }
  .day h2 { display:flex; justify-content:space-between; align-items:baseline; margin:0 4px 8px; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  .day h2 span { color:var(--muted); font-weight:500; font-variant-numeric:tabular-nums; }
  .split { display:flex; height:6px; border-radius:999px; overflow:hidden; gap:2px; margin:0 4px 12px; }
  .split i { display:block; height:100%; background:var(--cc); border-radius:999px; }
  .entry {
    display:flex; align-items:center; gap:12px; width:100%; padding:13px 16px 13px 14px; margin-bottom:8px; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
  }
  .entry .stripe { width:4px; align-self:stretch; border-radius:2px; background:var(--cc); flex:none; }
  .entry .main { flex:1; min-width:0; }
  .entry .t1 { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry .t1 em { font-style:normal; font-weight:400; color:var(--muted); }
  .entry .t2 { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .entry .dur { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); text-align:center; font-size:15px; margin:48px 12px; }
  #more { display:block; margin:18px auto 0; }

  /* edit sheet */
  #sheet { position:fixed; inset:0; z-index:10; display:flex; align-items:flex-end; justify-content:center; background:rgba(10,11,13,.42); }
  .card {
    width:100%; max-width:460px; max-height:92vh; overflow:auto; padding:22px 16px calc(18px + env(safe-area-inset-bottom));
    background:var(--paper); border-radius:28px 28px 0 0; animation:rise .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { transform:translateY(40px); opacity:0; } }
  .card h3 { margin:0 4px 16px; font-size:18px; font-weight:700; letter-spacing:-.02em; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:14px; font-weight:500; }
  .chip.active { background:var(--cc); color:var(--on-cc); border-color:transparent; }
  .chip.active .dot { background:var(--on-cc); }
  .when { display:grid; gap:10px; margin-top:12px; }
  .when > div { display:flex; align-items:center; gap:10px; }
  .when label { margin:0 0 0 8px; width:44px; flex:none; font-weight:500; color:var(--muted); }
  .when .field { flex:1; min-width:0; padding:0 16px; font-size:15px; }
  #sheetDur { margin:12px 6px 0; font-size:13px; color:var(--muted); min-height:18px; }
  #sheetErr { margin:8px 6px 0; font-size:13px; color:var(--danger); min-height:18px; }
  .sheet-actions { display:flex; gap:8px; margin-top:8px; }
  .sheet-actions .primary { flex:1; }
  #delEntry { color:var(--danger); }

  /* ---------- settings ---------- */
  label { display:block; font-size:14px; font-weight:600; margin:6px 0 8px; }
  .hint { font-size:13px; color:var(--muted); margin:8px 4px 26px; }
  .crow { margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row .field { flex:1; min-width:0; height:50px; }
  .swatch { width:50px; height:50px; flex:none; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; }
  .swatch i { width:22px; height:22px; border-radius:50%; background:var(--cc); }
  .row .x { flex:none; width:36px; height:36px; color:var(--muted); font-size:15px; }
  .palette { display:flex; flex-wrap:wrap; gap:10px; padding:12px 6px 6px; }
  .palette button { width:32px; height:32px; border-radius:50%; background:var(--cc); box-shadow:0 0 0 2px var(--paper), 0 0 0 0 var(--ink); }
  .palette button.on { box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .ghost { color:var(--muted); font-size:15px; font-weight:500; height:44px; width:100%; }
  #save { width:100%; height:54px; margin-top:18px; }

  /* ---------- focus screen ---------- */
  #focus { position:fixed; inset:0; z-index:20; transition:clip-path .62s cubic-bezier(.65,0,.25,1); overflow:hidden; color:var(--on-f); touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  #liquid { position:absolute; inset:0; background:var(--f); transform:translateY(100%); will-change:transform; }
  #liquid svg { position:absolute; left:0; bottom:calc(100% - 1px); width:200%; height:26px; fill:var(--f); animation:wave 1.4s linear infinite; }
  @keyframes wave { to { transform:translateX(-50%); } }
  .fcontent { position:absolute; inset:0; display:flex; flex-direction:column; padding:max(16px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom)); opacity:0; transition:opacity .4s ease; }
  #focus.full .fcontent { opacity:var(--fade, 1); }
  #focus.full.draining .fcontent { transition:none; }
  .ftop { display:flex; justify-content:space-between; align-items:center; }
  .fbtn { height:42px; min-width:42px; padding:0 16px; border-radius:999px; display:grid; place-items:center; background:color-mix(in srgb, var(--on-f) 16%, transparent); color:var(--on-f); font-size:15px; font-weight:600; }
  .fbtn svg { width:20px; height:20px; }
  .fmid { flex:1; }
  body.focusing header, body.focusing #tabbar { opacity:0; pointer-events:none; }
  header, #tabbar { transition:opacity .3s ease; }
  #fblob { position:absolute; display:none; width:42px; height:42px; padding:0; border-radius:50%; place-items:center; color:var(--on-f); background:transparent; }
  #fblob svg { width:20px; height:20px; }
  #focus.mini #fblob { display:grid; }
  #focus.sucking .fcontent { opacity:0 !important; transition:none; }
  #focus.sucking #liquid svg { display:none; }
  #dial.pop { animation:dialpop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes dialpop { 0% { transform:scale(var(--s0, 1.12)); } 35% { transform:scale(.92); } 65% { transform:scale(1.04); } 100% { transform:scale(1); } }
  #focus.mini .fcontent { display:none; }
  #focus.mini #liquid svg { display:none; }
  body.minimized header { padding-left:70px; }
  body.focusing #dial { z-index:21; box-shadow:0 30px 80px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.12); }
  #resume { display:block; margin:16px auto 0; height:42px; padding:0 18px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:14px; font-weight:600; }
  #msg button { margin-left:12px; padding:0; color:var(--ink); font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  #fmeta { font-size:15px; opacity:.75; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #fhint { font-size:13px; opacity:.6; margin-bottom:12px; }
  #fcat { margin:0; font-size:clamp(56px, 17vw, 116px); font-weight:800; line-height:.88; letter-spacing:-.05em; overflow-wrap:anywhere; }

  /* ---------- today timeline ---------- */
  #today { margin-top:0; }
  .thead { display:flex; justify-content:space-between; align-items:center; margin:0 4px 14px; }
  .thead h2 { margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em; }
  .thead h2 #todayDate { margin:0; font-size:17px; font-weight:700; color:var(--ink); }
  .thead h2 span { margin-left:6px; font-size:15px; font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums; }
  .zoom { display:flex; gap:6px; }
  .zoom button { width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:18px; line-height:1; }
  #tl { position:relative; touch-action:pan-x pan-y; }
  #tl .axis { position:absolute; left:64px; top:0; bottom:0; width:2px; margin-left:-1px; border-radius:1px; background:color-mix(in srgb, var(--ink) 11%, transparent); }
  #tl .hr { position:absolute; left:0; width:46px; text-align:right; font-size:11px; color:var(--muted); transform:translateY(-50%); font-variant-numeric:tabular-nums; }
  #tl .now { position:absolute; left:52px; width:24px; height:2px; margin-top:-1px; border-radius:1px; background:var(--ink); opacity:.5; }
  .blob { position:absolute; left:64px; width:16px; margin-left:-8px; padding:0; border-radius:999px; background:var(--cc); box-shadow:0 0 0 3px var(--paper); transition:transform .15s ease, height .25s ease, top .25s ease; }
  .blob:hover { transform:scaleX(1.25); }
  .blob.live { animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow:0 0 0 3px var(--paper), 0 0 0 9px color-mix(in srgb, var(--cc) 22%, transparent); } }
  .blabel { position:absolute; left:86px; font-size:13px; font-weight:500; color:var(--muted); transform:translateY(-50%); white-space:nowrap; pointer-events:none; }
  #peek { position:absolute; left:84px; right:0; z-index:2; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--line); box-shadow:0 14px 34px rgba(10,11,13,.14); animation:pop .18s ease-out; }
  @keyframes pop { from { transform:scale(.96); opacity:0; } }
  #peek .p1 { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #peek .p1 em { font-style:normal; font-weight:400; color:var(--muted); }
  #peek .p2 { font-size:13px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }
  #peek button { margin-top:10px; height:34px; padding:0 14px; border-radius:999px; background:var(--ink); color:var(--paper); font-size:13px; font-weight:600; }
  .tl-empty { color:var(--muted); font-size:14px; margin:0 4px 10px; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
  <header>
    <h1 id="heading">Timer</h1>
    <button class="round" id="theme" aria-label="Switch light or dark mode"></button>
  </header>

  <div id="pager">
  <!-- ===== timer ===== -->
  <section class="page" id="timer">
    <button id="dial" class="idle" aria-live="polite">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46" fill="none" stroke-width="2.4"/><circle class="ring" id="ring" cx="50" cy="50" r="46" fill="none" stroke-width="2.4" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/></svg>
      <span class="face">
        <span id="what">Loading…</span>
        <span id="sub"></span>
        <span id="clock">0:00:00</span>
        <span id="hint"></span>
      </span>
    </button>
    <div id="adjust" class="hidden">
      <button id="later" aria-label="Move start 5 minutes later">−5</button>
      <span id="startedAt"></span>
      <button id="earlier" aria-label="Move start 5 minutes earlier">+5</button>
    </div>
    <button id="cancel" class="hidden">Discard this session</button>
    <button id="resume" class="hidden"></button>
    <input id="title" class="field" placeholder="What are you working on? (optional)" autocomplete="off">
    <div id="cats"></div>
  <!-- ===== focus screen ===== -->
    <div id="focus" class="hidden" aria-live="polite">
      <div id="liquid"><svg viewBox="0 0 1200 26" preserveAspectRatio="none"><path d="M0 13 Q150 0 300 13 T600 13 T900 13 T1200 13 V26 H0 Z"/></svg></div>
      <button id="fblob" aria-label="Back to focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      <div class="fcontent">
        <div class="ftop">
          <button class="fbtn" id="fmin" aria-label="Minimise focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
          <button class="fbtn" id="fplus" aria-label="Move start 5 minutes earlier">+5</button>
        </div>
        <div class="fmid"></div>
        <div id="fmeta"></div>
        <div id="fhint">Hold the circle for 3 seconds to stop</div>
        <h2 id="fcat"></h2>
      </div>
    </div>
  </section>

  <!-- ===== today timeline ===== -->
  <section class="page" id="timeline">
    <div id="today">
      <div class="thead">
        <h2><span id="todayDate"></span><span id="todayTotal"></span></h2>
        <div class="zoom"><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button></div>
      </div>
      <div id="tl"></div>
    </div>
  </section>

  <!-- ===== history ===== -->
  <section class="page" id="history">
    <div class="bar-row"><button class="pillbtn primary" id="addEntry">Add entry</button></div>
    <div id="histList"></div>
    <button class="pillbtn soft hidden" id="more">Show earlier</button>
  </section>

  <!-- ===== settings ===== -->
  <section class="page" id="settings">
    <label for="calName">Log to calendar</label>
    <input id="calName" class="field" placeholder="Log">
    <p class="hint">Created if it doesn't exist. Type <b>primary</b> to use your main calendar.</p>
    <label>Categories</label>
    <div id="catRows"></div>
    <button id="addCat" class="ghost">+ Add category</button>
    <button id="save" class="pillbtn primary">Save settings</button>
    <button id="back" class="ghost">Discard changes</button>
    <div id="setMsg" class="hint" style="text-align:center"></div>
  </section>
  </div>

  <nav id="tabbar">
    <button data-view="timer" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2.5h4"/></svg>Timer</button>
    <button data-view="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v18"/><rect x="5.5" y="5" width="5" height="6" rx="2.5" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="2.5" fill="currentColor" stroke="none"/><path d="M14 8h6M14 16h4"/></svg>Today</button>
    <button data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</button>
    <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </nav>

  <div id="msg" role="status"></div>

  <!-- ===== edit sheet ===== -->
  <div id="sheet" class="hidden">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h3 id="sheetTitle">Edit entry</h3>
      <div class="chips" id="sheetCats"></div>
      <input id="sheetText" class="field" placeholder="Details (optional)" autocomplete="off">
      <div class="when">
        <div><label for="sheetStart">Start</label><input id="sheetStart" class="field" type="datetime-local"></div>
        <div><label for="sheetEnd">End</label><input id="sheetEnd" class="field" type="datetime-local"></div>
      </div>
      <div id="sheetDur"></div>
      <div id="sheetErr"></div>
      <div class="sheet-actions">
        <button class="pillbtn soft" id="sheetCancel">Cancel</button>
        <button class="pillbtn soft" id="delEntry">Delete</button>
        <button class="pillbtn primary" id="sheetSave">Save</button>
      </div>
    </div>
  </div>

<script>
  let S = null, COLORS = {}, running = null, tick = null, seq = 0, view = 'timer';
  const $ = id => document.getElementById(id);
  const hex = c => (COLORS[c] || ['', '#888888'])[1];
  const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const fmtDur = ms => { const m = Math.round(ms / 60000); return m < 1 ? '<1m' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : ''); };
  const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  let sayT = 0;
  const say = (t, action) => {
    const m = $('msg'); clearTimeout(sayT);
    if (!t) { m.classList.remove('show'); return; }
    m.textContent = t;
    m.style.pointerEvents = action ? 'auto' : 'none';
    if (action) {
      const b = document.createElement('button'); b.textContent = action.label;
      b.onclick = () => { m.classList.remove('show'); action.fn(); };
      m.appendChild(b);
    }
    m.classList.add('show');
    sayT = setTimeout(() => { m.classList.remove('show'); m.style.pointerEvents = 'none'; }, action ? 6000 : 2800);
  };
  const catByName = n => S.cats.find(c => c.name === n);

  // White or ink text, whichever contrasts more with the colour.
  function onColor(h) {
    const lin = v => (v /= 255) <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
    const n = parseInt(h.slice(1), 16);
    const L = .2126 * lin(n >> 16) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255);
    return 1.05 / (L + .05) >= (L + .05) / .06 ? '#FFFFFF' : '#16181C';
  }
  const paint = (el, colorKey) => { el.style.setProperty('--cc', hex(colorKey)); el.style.setProperty('--on-cc', onColor(hex(colorKey))); };

  // Server calls run one at a time, in order, while the UI updates instantly.
  let queue = Promise.resolve();
  function server(fn, args) {
    const p = queue.then(() => new Promise((ok, fail) =>
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...(args || []))));
    queue = p.catch(() => {});
    return p;
  }

  // ---------- light / dark ----------
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  let theme = null;
  try { theme = localStorage.getItem('glog-theme'); } catch (e) {}
  const isDark = () => theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  function applyTheme() {
    if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
    $('theme').innerHTML = isDark() ? SUN : MOON;
  }
  $('theme').onclick = () => {
    theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('glog-theme', theme); } catch (e) {}
    applyTheme();
  };
  applyTheme();

  // ---------- screens (swipe between them) ----------
  const PAGES = ['timer', 'timeline', 'history', 'settings'];
  const TITLES = { timer: 'Timer', timeline: 'Today', history: 'History', settings: 'Settings' };
  const pager = $('pager');
  let tlScrolled = false, settingsDirty = false;
  function setActive(v) {
    if (v === view) return;
    view = v;
    document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    $('heading').textContent = TITLES[v];
    if (!S) return;
    if (v === 'history') loadHistory();
    if (v === 'timeline') { loadToday(); if (!tlScrolled) { tlScrolled = true; scrollTimelineToNow(); } }
    if (v === 'settings' && !settingsDirty) fillSettings();
  }
  function show(v, instant) {
    const i = PAGES.indexOf(v);
    pager.scrollTo({ left: i * pager.clientWidth, behavior: instant || reducedMotion ? 'auto' : 'smooth' });
    setActive(v);
  }
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let pageT = 0;
  pager.addEventListener('scroll', () => {
    clearTimeout(pageT);
    pageT = setTimeout(() => setActive(PAGES[Math.round(pager.scrollLeft / pager.clientWidth)] || 'timer'), 60);
  }, { passive: true });
  window.addEventListener('resize', () => pager.scrollTo({ left: PAGES.indexOf(view) * pager.clientWidth }));
  document.querySelectorAll('#tabbar button').forEach(b => b.onclick = () => show(b.dataset.view));
  function scrollTimelineToNow() {
    requestAnimationFrame(() => {
      const n = document.querySelector('#tl .now'), pg = $('timeline');
      if (n) pg.scrollTop = Math.max(0, n.offsetTop + $('tl').offsetTop - pg.clientHeight * .6);
    });
  }

  // ---------- timer ----------
  let selected = null;
  const HOLD_MS = 3000;
  let lastStopped = null, overlayAnim = false;

  function renderCats() {
    $('cats').innerHTML = '';
    S.cats.forEach(c => {
      const b = document.createElement('button');
      b.className = 'cat'; paint(b, c.color);
      b.innerHTML = '<span class="dot"></span><span></span>';
      b.lastChild.textContent = c.name;
      b.dataset.name = c.name;
      b.onclick = () => { selected = c.name; renderTimer(); };
      $('cats').appendChild(b);
    });
  }

  function holdAction() {
    if (!running) return selected ? 'start' : null;
    if ((selected && selected !== running.cat) || $('title').value.trim()) return 'switch';
    return 'stop';
  }
  function setRing(p) { const r = $('ring'); r.setAttribute('stroke-dasharray', `${(p * 100).toFixed(2)} 100`); r.style.opacity = p > 0.005 ? 1 : 0; }

  function renderTimer() {
    clearInterval(tick);
    if (selected && !catByName(selected)) selected = null;
    document.querySelectorAll('.cat').forEach(b => b.classList.toggle('active', b.dataset.name === selected));
    const dial = $('dial'), act = holdAction();
    const shown = running ? running : (selected ? { cat: selected, color: catByName(selected).color } : null);
    dial.style.setProperty('--ring', shown ? hex(shown.color) : '#16181C');
    dial.classList.toggle('idle', !running);
    $('cancel').classList.toggle('hidden', !running);
    $('adjust').classList.toggle('hidden', !running);
    if (running) {
      $('startedAt').textContent = 'Started ' + fmtTime(running.start);
      $('later').disabled = Date.now() - running.start < 60000;
    }
    if (!holding) setRing(running ? 1 : 0);
    $('what').textContent = shown ? shown.cat : 'Pick a category';
    $('sub').textContent = running ? (running.title || '') : '';
    $('hint').textContent = act === 'start' ? 'Hold to start'
      : act === 'switch' ? 'Hold to switch to ' + (selected || running.cat)
      : act === 'stop' ? (focusOpen() ? 'Hold 3s to stop' : 'Hold to stop · tap to focus') : 'then hold here';
    const canResume = !running && lastStopped && Date.now() - lastStopped.end < 30 * 60000;
    $('resume').classList.toggle('hidden', !canResume);
    if (canResume) $('resume').textContent = `↺  Resume ${lastStopped.cat} · stopped ${fmtTime(lastStopped.end)}`;
    if (running) {
      const upd = () => { $('clock').textContent = fmt(Date.now() - running.start); $('later').disabled = Date.now() - running.start < 60000; };
      $('fcat').textContent = running.cat;
      $('fmeta').textContent = (running.title ? running.title + '  ·  ' : '') + 'Started ' + fmtTime(running.start);
      focusColor(running.color);
      upd(); tick = setInterval(upd, 1000);
    } else {
      $('clock').textContent = '0:00:00';
      if (focusVisible() && !holding && !overlayAnim) closeFocus();
    }
    if (S) renderToday();
  }

  let holding = false, holdT0 = 0, raf = 0, holdAct = null, dialScale = 1;
  const focusVisible = () => !$('focus').classList.contains('hidden');
  const focusOpen = () => focusVisible() && !$('focus').classList.contains('mini');

  // The circle shakes harder and grows while you hold; nothing else happens until 3 seconds.
  function shakeDial(p, extra) {
    const d = $('dial'), k = Math.pow(p, 1.4), amp = reduced ? 0 : 5 * k + (extra || 0);
    dialScale = 1 + .12 * (1 - Math.pow(1 - p, 2)) + (extra ? extra / 60 : 0);
    const dx = (Math.random() - .5) * 2 * amp, dy = (Math.random() - .5) * 2 * amp, rot = (Math.random() - .5) * 3 * k;
    d.style.transition = 'none';
    d.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${dialScale.toFixed(3)})`;
  }
  function popDial() {
    const d = $('dial');
    d.style.setProperty('--s0', dialScale.toFixed(3));
    d.style.transform = ''; d.style.transition = '';
    d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop');
    setTimeout(() => d.classList.remove('pop'), 520);
    dialScale = 1;
  }
  function settleDial() {
    const d = $('dial');
    d.style.transition = 'transform .3s cubic-bezier(.3,1.4,.5,1)'; d.style.transform = '';
    dialScale = 1;
  }

  function holdStart(e) {
    if (e) e.preventDefault();
    const act = holdAction();
    if (holding || !act || overlayAnim) return;
    holding = true; holdAct = act; holdT0 = performance.now(); $('dial').classList.add('holding');
    const filling = act !== 'stop';
    const step = now => {
      const p = Math.min(1, (now - holdT0) / HOLD_MS);
      setRing(filling ? p : 1 - p);
      shakeDial(p);
      if (p >= 1) { holdEnd(true); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  function holdEnd(done) {
    if (!holding) return;
    holding = false; cancelAnimationFrame(raf); $('dial').classList.remove('holding');
    const act = holdAct;
    if (done === true) {
      if (navigator.vibrate) navigator.vibrate(act === 'stop' ? [12, 40, 30] : 22);
      if (act === 'stop') {
        const suck = focusOpen() && !reduced;
        overlayAnim = suck;
        stop();
        if (suck) vacuum(() => { overlayAnim = false; closeFocus(); popDial(); });
        else { closeFocus(); popDial(); }
      } else {
        leaveMini();
        start(catByName(selected || running.cat));
        popDial();
        openFocus(1100);   // the liquid floods in once the hold is done
      }
      return;
    }
    const tap = performance.now() - holdT0 < 220;
    settleDial(); renderTimer();
    if (tap && running && !focusOpen()) openFocus(650);
  }

  // High-pressure vacuum: the liquid is yanked into the circle, accelerating and jittering.
  function vacuum(done) {
    const r = $('dial').getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const R0 = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy)), MS = 560;
    F.classList.add('sucking'); F.style.transition = 'none';
    setLevel(0);
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / MS);
      const e = Math.pow(p, 3.2);
      const jit = (1 - p) * (p > .04 ? 1 : 0);
      const rad = Math.max(0, R0 * (1 - e) + (Math.random() - .5) * 46 * jit);
      const jx = cx + (Math.random() - .5) * 12 * jit, jy = cy + (Math.random() - .5) * 12 * jit;
      F.style.clipPath = `circle(${rad.toFixed(1)}px at ${jx.toFixed(1)}px ${jy.toFixed(1)}px)`;
      shakeDial(1, 3 + 6 * e);   // keeps swelling and rattling while it swallows the liquid
      if (p < 1) { requestAnimationFrame(step); return; }
      F.classList.remove('sucking'); F.style.clipPath = ''; F.style.transition = '';
      done();
    };
    requestAnimationFrame(step);
  }
  const dial = $('dial');
  dial.addEventListener('pointerdown', holdStart);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => dial.addEventListener(ev, () => holdEnd(false)));
  dial.addEventListener('contextmenu', e => e.preventDefault());
  dial.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) holdStart(e); });
  dial.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') holdEnd(false); });
  $('title').addEventListener('input', () => { if (running) renderTimer(); });

  // ----- forgot to start? move the start time -----
  const NUDGE_MIN = 5;
  let startSync = 0;
  function nudge(min) {
    if (!running) return;
    running.start = Math.min(Date.now(), running.start - min * 60000);
    renderTimer();
    clearTimeout(startSync);
    startSync = setTimeout(syncStart, 700);
  }
  function syncStart() {
    clearTimeout(startSync); startSync = 0;
    if (!running) return;
    const want = running.start;
    server('setStart', [want])
      .then(s => { if (running && running.id === s.id) say('Start moved to ' + fmtTime(s.start)); })
      .catch(e => say("Couldn't move the start time: " + e.message));
  }
  $('earlier').onclick = () => nudge(NUDGE_MIN);
  $('later').onclick = () => nudge(-NUDGE_MIN);

  function start(c) {
    if (startSync) syncStart();
    lastStopped = null;
    const prev = running, title = $('title').value.trim(), my = ++seq;
    const t0 = Date.now();
    running = { cat: c.name, color: c.color, title, start: t0 };
    selected = c.name;
    $('title').value = ''; $('title').blur();
    renderTimer(); say('');
    server('start', [c.name, title])
      .then(s => {
        if (my !== seq) return;
        const shift = running ? running.start - t0 : 0;   // +5 tapped before the server answered
        running = s;
        if (shift) { running.start += shift; syncStart(); }
        renderTimer(); say('Logging to ' + S.calendar); loadToday();
      })
      .catch(e => { if (my === seq) { running = prev; renderTimer(); } say("Couldn't start: " + e.message); });
  }
  function stop() {
    if (startSync) syncStart();
    const prev = running, my = ++seq;
    running = null;
    lastStopped = prev ? Object.assign({}, prev, { end: Date.now() }) : null;
    renderTimer();
    if (prev) say(`Saved ${fmtDur(Date.now() - prev.start)} of ${prev.cat}`, { label: 'Undo', fn: resume });
    server('stop').then(() => loadToday())
      .catch(e => { if (my === seq) { running = prev; renderTimer(); } say("Couldn't save: " + e.message); });
  }
  function resume() {
    if (running || !lastStopped) return;
    const ls = lastStopped, my = ++seq;
    lastStopped = null;
    running = Object.assign({}, ls); delete running.end;
    renderTimer(); say('Resumed ' + ls.cat);
    server('resume')
      .then(s => { if (my === seq) { running = s; renderTimer(); loadToday(); } })
      .catch(e => { if (my === seq) { running = null; lastStopped = ls; renderTimer(); } say("Couldn't resume: " + e.message); });
  }
  $('resume').onclick = resume;

  $('cancel').onclick = () => {
    clearTimeout(startSync); startSync = 0; lastStopped = null;
    const prev = running, my = ++seq;
    running = null; renderTimer();
    server('cancel').then(() => say('Discarded'))
      .catch(e => { if (my === seq) { running = prev; renderTimer(); } say("Couldn't discard: " + e.message); });
  };

  // ---------- history ----------
  let histDays = 7, hist = [];
  const dayStart = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function dayLabel(ms) {
    const today = dayStart(Date.now());
    if (ms === today) return 'Today';
    if (ms === today - 864e5) return 'Yesterday';
    return new Date(ms).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function loadHistory() {
    if (!hist.length) $('histList').innerHTML = '<p class="empty">Loading your log…</p>';
    const from = dayStart(Date.now() - (histDays - 1) * 864e5);
    server('history', [from, Date.now() + 60000])
      .then(list => { hist = list; renderHistory(); })
      .catch(e => { $('histList').innerHTML = ''; say("Couldn't load history: " + e.message); });
  }

  function renderHistory() {
    const box = $('histList'); box.innerHTML = '';
    $('more').classList.remove('hidden');
    if (!hist.length) {
      box.innerHTML = `<p class="empty">Nothing logged in the last ${histDays} days. Start a timer, or add an entry by hand.</p>`;
      return;
    }
    const days = new Map();
    hist.slice().sort((a, b) => b.start - a.start).forEach(e => {
      const k = dayStart(e.start); if (!days.has(k)) days.set(k, []); days.get(k).push(e);
    });
    days.forEach((list, k) => {
      const total = list.reduce((t, e) => t + (e.end - e.start), 0);
      const sec = document.createElement('section'); sec.className = 'day';
      const h = document.createElement('h2');
      h.innerHTML = '<b></b><span></span>'; h.firstChild.textContent = dayLabel(k); h.lastChild.textContent = fmtDur(total);
      sec.appendChild(h);
      // per-category split for the day
      const byCat = {}; list.forEach(e => { byCat[e.cat] = byCat[e.cat] || { ms: 0, color: e.color }; byCat[e.cat].ms += e.end - e.start; });
      const split = document.createElement('div'); split.className = 'split';
      Object.values(byCat).sort((a, b) => b.ms - a.ms).forEach(v => { const i = document.createElement('i'); paint(i, v.color); i.style.flex = v.ms; split.appendChild(i); });
      sec.appendChild(split);
      list.forEach(e => {
        const b = document.createElement('button'); b.className = 'entry'; paint(b, e.color);
        b.innerHTML = '<span class="stripe"></span><span class="main"><div class="t1"></div><div class="t2"></div></span><span class="dur"></span>';
        const t1 = b.querySelector('.t1'); t1.textContent = e.cat;
        if (e.title) { const em = document.createElement('em'); em.textContent = ' · ' + e.title; t1.appendChild(em); }
        b.querySelector('.t2').textContent = fmtTime(e.start) + ' – ' + fmtTime(e.end);
        b.querySelector('.dur').textContent = fmtDur(e.end - e.start);
        b.onclick = () => openSheet(e);
        sec.appendChild(b);
      });
      box.appendChild(sec);
    });
  }
  $('more').onclick = () => { histDays += 7; loadHistory(); };
  $('addEntry').onclick = () => openSheet(null);

  // ----- edit sheet -----
  let editing = null, sheetCat = null, delArmed = false;
  const toLocal = ms => { const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
  const fromLocal = v => v ? new Date(v).getTime() : NaN;

  function openSheet(e) {
    editing = e;
    const now = Date.now();
    sheetCat = e ? (catByName(e.cat) ? e.cat : null) : (selected || S.cats[0].name);
    $('sheetTitle').textContent = e ? 'Edit entry' : 'Add entry';
    $('sheetText').value = e ? e.title : '';
    $('sheetStart').value = toLocal(e ? e.start : now - 30 * 60000);
    $('sheetEnd').value = toLocal(e ? e.end : now);
    $('delEntry').classList.toggle('hidden', !e);
    $('delEntry').textContent = 'Delete'; delArmed = false;
    $('sheetErr').textContent = e && !sheetCat ? `“${e.cat}” isn't one of your categories. Pick one to save.` : '';
    renderSheetCats(); updDur();
    $('sheet').classList.remove('hidden');
  }
  function closeSheet() { $('sheet').classList.add('hidden'); editing = null; }
  function renderSheetCats() {
    const box = $('sheetCats'); box.innerHTML = '';
    S.cats.forEach(c => {
      const b = document.createElement('button'); b.className = 'chip' + (c.name === sheetCat ? ' active' : ''); paint(b, c.color);
      b.innerHTML = '<span class="dot"></span><span></span>'; b.lastChild.textContent = c.name;
      b.onclick = () => { sheetCat = c.name; $('sheetErr').textContent = ''; renderSheetCats(); };
      box.appendChild(b);
    });
  }
  function updDur() {
    const s = fromLocal($('sheetStart').value), e = fromLocal($('sheetEnd').value);
    $('sheetDur').textContent = e > s ? 'Duration ' + fmtDur(e - s) : '';
  }
  ['sheetStart', 'sheetEnd'].forEach(id => $(id).addEventListener('input', updDur));
  $('sheetCancel').onclick = closeSheet;
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').classList.contains('hidden')) closeSheet(); });

  $('sheetSave').onclick = () => {
    const start = fromLocal($('sheetStart').value), end = fromLocal($('sheetEnd').value);
    if (!sheetCat) { $('sheetErr').textContent = 'Pick a category.'; return; }
    if (!(end > start)) { $('sheetErr').textContent = 'End time must be after the start time.'; return; }
    const entry = { id: editing && editing.id, cat: sheetCat, title: $('sheetText').value.trim(), start, end };
    $('sheetSave').disabled = true; $('sheetSave').textContent = 'Saving…';
    server('saveEntry', [entry])
      .then(() => { closeSheet(); say(entry.id ? 'Entry updated' : 'Entry added'); hist = []; if (view === 'history') loadHistory(); loadToday(); })
      .catch(e => { $('sheetErr').textContent = "Couldn't save: " + e.message; })
      .finally(() => { $('sheetSave').disabled = false; $('sheetSave').textContent = 'Save'; });
  };
  $('delEntry').onclick = () => {
    if (!delArmed) { delArmed = true; $('delEntry').textContent = 'Tap again to delete'; return; }
    const id = editing.id;
    hist = hist.filter(x => x.id !== id); renderHistory(); closeSheet();
    today = today.filter(x => x.id !== id); renderToday();
    server('deleteEntry', [id]).then(() => { say('Entry deleted'); loadToday(); })
      .catch(e => { say("Couldn't delete: " + e.message); loadHistory(); });
  };

  // ---------- focus screen ----------
  const F = $('focus');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let level = 1, lvRaf = 0, fullT = 0;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function focusColor(c) { const h = hex(c); F.style.setProperty('--f', h); F.style.setProperty('--on-f', onColor(h)); }
  function setLevel(v) { level = v; $('liquid').style.transform = `translateY(${(v * 100).toFixed(2)}%)`; }
  function animateLevel(to, ms, done) {
    cancelAnimationFrame(lvRaf);
    const from = level, t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / ms);
      setLevel(from + (to - from) * ease(p));
      if (p < 1) lvRaf = requestAnimationFrame(step); else if (done) done();
    };
    lvRaf = requestAnimationFrame(step);
  }
  function openFocus(ms) {
    if (!running) return;
    if (F.classList.contains('mini')) { releaseFromBlob(); return; }
    ms = ms || 1100;
    focusColor(running.color); renderTimer();
    clearTimeout(fullT);
    F.style.setProperty('--fade', 1);
    F.classList.remove('hidden', 'full'); document.body.classList.add('focusing');
    if (reduced) { setLevel(0); F.classList.add('full'); return; }
    setLevel(1);
    animateLevel(0, ms);
    fullT = setTimeout(() => F.classList.add('full'), ms * .5);
  }
  function closeFocus() {
    cancelAnimationFrame(lvRaf); clearTimeout(fullT);
    leaveMini();
    F.classList.add('hidden'); F.classList.remove('full', 'draining'); setLevel(1);
    document.body.classList.remove('focusing'); renderTimer();
  }
  // ⌄ sucks the liquid into a little bubble; tapping the bubble pours it back out.
  let blobAt = null, clipT = 0;
  const bigR = () => Math.hypot(innerWidth, innerHeight);
  function setClip(r, animate) {
    F.style.transition = animate && !reduced ? '' : 'none';
    F.style.clipPath = `circle(${r}px at ${blobAt.x}px ${blobAt.y}px)`;
    if (!animate || reduced) { void F.offsetWidth; F.style.transition = ''; }
  }
  function minimiseFocus() {
    if (!focusOpen()) return;
    const r = $('fmin').getBoundingClientRect();
    blobAt = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    Object.assign($('fblob').style, { left: (blobAt.x - 21) + 'px', top: (blobAt.y - 21) + 'px' });
    F.classList.remove('full');
    setClip(bigR(), false);
    requestAnimationFrame(() => setClip(21, true));
    clearTimeout(clipT);
    clipT = setTimeout(() => {
      F.classList.add('mini');
      document.body.classList.remove('focusing');
      document.body.classList.add('minimized');
      renderTimer();
    }, reduced ? 0 : 560);
  }
  function releaseFromBlob() {
    if (!F.classList.contains('mini') || !running) return;
    clearTimeout(clipT);
    F.classList.remove('mini');
    document.body.classList.remove('minimized');
    document.body.classList.add('focusing');
    show('timer', true); $('timer').scrollTop = 0;
    renderTimer();
    setClip(bigR(), true);
    clipT = setTimeout(() => { F.classList.add('full'); }, reduced ? 0 : 300);
    setTimeout(() => { if (!F.classList.contains('mini')) F.style.clipPath = ''; }, reduced ? 0 : 700);
  }
  function leaveMini() {
    clearTimeout(clipT);
    F.classList.remove('mini'); F.style.clipPath = '';
    document.body.classList.remove('minimized');
  }
  $('fmin').onclick = minimiseFocus;
  $('fblob').onclick = releaseFromBlob;
  $('fplus').onclick = () => nudge(NUDGE_MIN);
  F.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !F.classList.contains('hidden')) $('fmin').click(); });

  // ---------- today timeline ----------
  const SCALES = [20, 30, 44, 64, 96, 140, 200];   // pixels per hour
  let today = [], scale = 44, peekId = null;
  try { const v = Number(localStorage.getItem('glog-scale')); if (v >= 16 && v <= 260) scale = v; } catch (e) {}
  function setScale(v) {
    scale = Math.max(16, Math.min(260, v));
    try { localStorage.setItem('glog-scale', String(Math.round(scale))); } catch (e) {}
    renderToday();
  }
  $('zoomIn').onclick = () => setScale(SCALES.find(x => x > scale + 1) || 260);
  $('zoomOut').onclick = () => setScale([...SCALES].reverse().find(x => x < scale - 1) || 16);

  function loadToday() {
    server('history', [dayStart(Date.now()), Date.now() + 60000])
      .then(list => { today = list; renderToday(); })
      .catch(() => {});
  }

  function renderToday() {
    const tl = $('tl'), now = Date.now(), H = 3600e3, PAD = 14;
    const items = today.slice();
    if (running) items.push({ id: '__live', live: true, cat: running.cat, title: running.title, color: running.color, start: running.start, end: now });
    const total = items.reduce((t, e) => t + (e.end - e.start), 0);
    $('todayTotal').textContent = total ? fmtDur(total) : '';
    $('todayDate').textContent = new Date(now).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    const d0 = dayStart(now);
    const first = items.length ? Math.min(...items.map(e => e.start)) : now;
    const from = Math.max(d0, Math.floor(Math.min(first, now - 2 * H) / H) * H);
    const to = Math.ceil((now + 1) / H) * H;
    const y = ms => PAD + (ms - from) / H * scale;
    tl.innerHTML = '';
    tl.style.height = (y(to) + PAD) + 'px';
    const add = (cls, css, html) => { const el = document.createElement('div'); el.className = cls; Object.assign(el.style, css); if (html) el.textContent = html; tl.appendChild(el); return el; };
    add('axis', {});
    const step = scale < 28 ? 3 : scale < 40 ? 2 : 1;
    for (let t = from; t <= to; t += H) {
      const hr = new Date(t).getHours();
      if (hr % step) continue;
      add('hr', { top: y(t) + 'px' }, new Date(t).toLocaleTimeString([], { hour: 'numeric' }));
    }
    add('now', { top: y(now) + 'px' });
    let lastLabel = -1e9;
    items.sort((a, b) => a.start - b.start).forEach(e => {
      const top = y(e.start), h = Math.max(16, (e.end - e.start) / H * scale);
      const b = document.createElement('button');
      b.className = 'blob' + (e.live ? ' live' : ''); paint(b, e.color);
      Object.assign(b.style, { top: top + 'px', height: h + 'px' });
      b.setAttribute('aria-label', `${e.cat}, ${fmtTime(e.start)} to ${e.live ? 'now' : fmtTime(e.end)}`);
      b.onclick = ev => { ev.stopPropagation(); peekId = peekId === e.id ? null : e.id; renderToday(); };
      tl.appendChild(b);
      const mid = top + h / 2;
      if (mid - lastLabel >= 18) { add('blabel', { top: mid + 'px' }, e.cat); lastLabel = mid; }
      if (peekId === e.id) {
        const p = document.createElement('div'); p.id = 'peek';
        p.style.top = Math.max(0, mid - 40) + 'px';
        p.innerHTML = '<div class="p1"></div><div class="p2"></div>';
        p.querySelector('.p1').textContent = e.cat;
        if (e.title) { const em = document.createElement('em'); em.textContent = ' · ' + e.title; p.querySelector('.p1').appendChild(em); }
        p.querySelector('.p2').textContent = `${fmtTime(e.start)} – ${e.live ? 'now' : fmtTime(e.end)}  ·  ${fmtDur(e.end - e.start)}`;
        if (!e.live) {
          const ed = document.createElement('button'); ed.textContent = 'Edit';
          ed.onclick = ev => { ev.stopPropagation(); peekId = null; openSheet(e); renderToday(); };
          p.appendChild(ed);
        }
        p.onclick = ev => ev.stopPropagation();
        tl.appendChild(p);
      }
    });
    if (!items.length) add('hr', { top: '0px', left: '84px', width: 'auto', textAlign: 'left', transform: 'none', fontSize: '14px' }, 'Nothing logged yet today.');
  }
  document.addEventListener('click', () => { if (peekId) { peekId = null; renderToday(); } });
  setInterval(() => { if (running && view === 'timeline') renderToday(); }, 30000);

  // pinch to zoom
  let pinch = null;
  $('tl').addEventListener('touchstart', e => {
    if (e.touches.length === 2) pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), s: scale };
  }, { passive: true });
  $('tl').addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    setScale(pinch.s * d / pinch.d);
  }, { passive: false });
  $('tl').addEventListener('touchend', () => { pinch = null; });
  $('tl').addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setScale(scale * (e.deltaY < 0 ? 1.1 : 0.9)); } }, { passive: false });

  // ---------- settings ----------
  function catRow(c) {
    const wrap = document.createElement('div'); wrap.className = 'crow'; wrap.dataset.color = c.color;
    const row = document.createElement('div'); row.className = 'row';
    const sw = document.createElement('button'); sw.className = 'swatch'; sw.innerHTML = '<i></i>'; sw.setAttribute('aria-label', 'Choose colour');
    const name = document.createElement('input'); name.className = 'field'; name.value = c.name; name.placeholder = 'Category name';
    const del = document.createElement('button'); del.className = 'x'; del.textContent = '✕'; del.setAttribute('aria-label', 'Remove category');
    del.onclick = () => wrap.remove();
    const pal = document.createElement('div'); pal.className = 'palette hidden';
    const sync = () => {
      paint(sw, wrap.dataset.color);
      pal.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.color === wrap.dataset.color));
    };
    Object.entries(COLORS).forEach(([id, [label]]) => {
      const b = document.createElement('button'); b.dataset.color = id; b.title = label; b.setAttribute('aria-label', label); paint(b, id);
      b.onclick = () => { wrap.dataset.color = id; sync(); pal.classList.add('hidden'); };
      pal.appendChild(b);
    });
    sw.onclick = () => pal.classList.toggle('hidden');
    row.append(sw, name, del); wrap.append(row, pal); sync();
    return wrap;
  }
  function fillSettings() {
    $('calName').value = S.calendar;
    $('catRows').innerHTML = '';
    S.cats.forEach(c => $('catRows').appendChild(catRow(c)));
    $('setMsg').textContent = '';
    settingsDirty = false;
  }
  $('settings').addEventListener('input', () => { settingsDirty = true; });
  $('settings').addEventListener('click', e => { if (e.target.closest('.palette button, .x, #addCat')) settingsDirty = true; });
  $('back').onclick = () => { fillSettings(); say('Changes discarded'); };
  $('addCat').onclick = () => { const r = catRow({ name: '', color: 'GRAY' }); $('catRows').appendChild(r); r.querySelector('input').focus(); };
  $('save').onclick = () => {
    const cats = [...$('catRows').children].map(r => ({ name: r.querySelector('input').value, color: r.dataset.color }));
    $('save').disabled = true; $('save').textContent = 'Saving…';
    server('saveSettings', [{ calendar: $('calName').value, cats }])
      .then(init => { S = init.settings; hist = []; renderCats(); renderTimer(); fillSettings(); say('Settings saved'); })
      .catch(e => { $('setMsg').textContent = "Couldn't save settings: " + e.message; })
      .finally(() => { $('save').disabled = false; $('save').textContent = 'Save settings'; });
  };

  // ---------- boot ----------
  server('getInit')
    .then(init => { S = init.settings; COLORS = init.colors; running = init.running; lastStopped = init.lastStopped || null; selected = running ? running.cat : null; renderCats(); renderTimer(); loadToday(); fillSettings(); })
    .catch(e => { $('what').textContent = "Couldn't load"; $('sub').textContent = e.message; });
</script>
</body>
</html>
